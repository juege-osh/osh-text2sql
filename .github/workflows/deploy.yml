name: Deploy OSH Text2SQL

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: deploy-osh-text2sql
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST || '43.242.200.25' }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER || 'root' }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '58753' }}
  BACKEND_DEPLOY_DIR: ${{ vars.BACKEND_DEPLOY_DIR || '/opt/osh/app/osh/osh-text2sql' }}
  BACKEND_JAR_NAME: ${{ vars.BACKEND_JAR_NAME || 'osh-text2sql-backend.jar' }}
  BACKEND_ENV_FILE: ${{ vars.BACKEND_ENV_FILE || '/opt/osh/app/osh/osh-text2sql/app.env' }}
  BACKEND_LOG_DIR: ${{ vars.BACKEND_LOG_DIR || '/www/osh/004-log/osh/osh-text2sql' }}
  DOCKER_COMPOSE_DIR: ${{ vars.DOCKER_COMPOSE_DIR || '/opt/osh/001-docker-compose/osh' }}
  DOCKER_COMPOSE_FILE: ${{ vars.DOCKER_COMPOSE_FILE || 'docker-compose.osh.yml' }}
  DOCKER_STACK_ENV_FILE: ${{ vars.DOCKER_STACK_ENV_FILE || 'osh-stack.env' }}
  BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME || 'osh-text2sql' }}
  APP_PORT: ${{ vars.OSH_TEXT2SQL_SERVER_PORT || '59101' }}

jobs:
  deploy:
    name: Build and deploy integrated app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend jar
        working-directory: backend
        run: ./mvnw clean package -DskipTests

      - name: Validate jar output
        run: |
          test -f backend/target/osh-text2sql-backend-1.0.0-SNAPSHOT.jar
          unzip -t backend/target/osh-text2sql-backend-1.0.0-SNAPSHOT.jar >/tmp/osh-text2sql-jar-check.log

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/known_hosts <<'EOF'
          ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          EOF
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Ensure remote directories exist
        run: |
          ssh -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$BACKEND_DEPLOY_DIR' '$BACKEND_LOG_DIR' '$DOCKER_COMPOSE_DIR'"

      - name: Stop backend before replacing jar
        run: |
          ssh -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DOCKER_COMPOSE_DIR' && \
            (docker compose --env-file '$DOCKER_STACK_ENV_FILE' -f '$DOCKER_COMPOSE_FILE' stop '$BACKEND_SERVICE_NAME' || \
            docker-compose --env-file '$DOCKER_STACK_ENV_FILE' -f '$DOCKER_COMPOSE_FILE' stop '$BACKEND_SERVICE_NAME' || true)"

      - name: Upload backend jar
        run: |
          rsync -az --inplace --progress \
            -e "ssh -o ConnectTimeout=30 -p $DEPLOY_PORT" \
            backend/target/osh-text2sql-backend-1.0.0-SNAPSHOT.jar \
            "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_DEPLOY_DIR/$BACKEND_JAR_NAME"

      - name: Verify remote jar integrity
        run: |
          local_sha="$(sha256sum backend/target/osh-text2sql-backend-1.0.0-SNAPSHOT.jar | cut -d ' ' -f 1)"
          remote_sha="$(ssh -o ConnectTimeout=30 -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sha256sum '$BACKEND_DEPLOY_DIR/$BACKEND_JAR_NAME' | cut -d ' ' -f 1")"
          echo "local_sha=$local_sha"
          echo "remote_sha=$remote_sha"
          test "$local_sha" = "$remote_sha"

      - name: Write remote environment file
        run: |
          ssh -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$BACKEND_ENV_FILE' <<'EOF'
          OSH_TEXT2SQL_SERVER_PORT=${{ vars.OSH_TEXT2SQL_SERVER_PORT || '59101' }}
          SPRING_DATA_REDIS_HOST=${{ vars.SPRING_DATA_REDIS_HOST || '43.242.200.25' }}
          SPRING_DATA_REDIS_PORT=${{ vars.SPRING_DATA_REDIS_PORT || '56379' }}
          SPRING_DATA_REDIS_DATABASE=${{ vars.SPRING_DATA_REDIS_DATABASE || '0' }}
          SPRING_DATA_REDIS_PASSWORD=${{ secrets.SPRING_DATA_REDIS_PASSWORD || 'juegetech_88888888' }}
          OSH_TEXT2SQL_DASHSCOPE_ENABLED=${{ vars.OSH_TEXT2SQL_DASHSCOPE_ENABLED || 'false' }}
          OSH_TEXT2SQL_DASHSCOPE_API_KEY=${{ secrets.OSH_TEXT2SQL_DASHSCOPE_API_KEY }}
          OSH_TEXT2SQL_DASHSCOPE_MODEL=${{ vars.OSH_TEXT2SQL_DASHSCOPE_MODEL || 'qwen-plus' }}
          OSH_TEXT2SQL_OPENAI_API_KEY=${{ secrets.OSH_TEXT2SQL_OPENAI_API_KEY }}
          OSH_TEXT2SQL_OPENAI_BASE_URL=${{ vars.OSH_TEXT2SQL_OPENAI_BASE_URL || 'https://ai.yaoyanryan.dpdns.org' }}
          OSH_TEXT2SQL_OPENAI_MODEL=${{ vars.OSH_TEXT2SQL_OPENAI_MODEL || 'gpt-5.4' }}
          OSH_TEXT2SQL_OPENAI_COMPLETIONS_PATH=${{ vars.OSH_TEXT2SQL_OPENAI_COMPLETIONS_PATH || '/v1/chat/completions' }}
          OSH_TEXT2SQL_AI_PROVIDER=${{ vars.OSH_TEXT2SQL_AI_PROVIDER || 'aicodee' }}
          OSH_TEXT2SQL_AI_REASONING_EFFORT=${{ vars.OSH_TEXT2SQL_AI_REASONING_EFFORT || 'medium' }}
          OSH_TEXT2SQL_AICODEE_API_KEY=${{ secrets.OSH_TEXT2SQL_AICODEE_API_KEY || 'sk-d758a8ebc1aa79920b6a20d9fd14873a' }}
          OSH_TEXT2SQL_AICODEE_BASE_URL=${{ vars.OSH_TEXT2SQL_AICODEE_BASE_URL || 'https://v2.aicodee.com' }}
          OSH_TEXT2SQL_AICODEE_MODEL=${{ vars.OSH_TEXT2SQL_AICODEE_MODEL || 'MiniMax-M2.7-highspeed' }}
          OSH_TEXT2SQL_AICODEE_COMPLETIONS_PATH=${{ vars.OSH_TEXT2SQL_AICODEE_COMPLETIONS_PATH || '/v1/chat/completions' }}
          OSH_TEXT2SQL_MYSQL_HOST=${{ vars.OSH_TEXT2SQL_MYSQL_HOST || '43.242.200.25' }}
          OSH_TEXT2SQL_MYSQL_PORT=${{ vars.OSH_TEXT2SQL_MYSQL_PORT || '53306' }}
          OSH_TEXT2SQL_MYSQL_DATABASE=${{ vars.OSH_TEXT2SQL_MYSQL_DATABASE || 'backstage' }}
          OSH_TEXT2SQL_MYSQL_USERNAME=${{ secrets.OSH_TEXT2SQL_MYSQL_USERNAME || 'root' }}
          OSH_TEXT2SQL_MYSQL_PASSWORD=${{ secrets.OSH_TEXT2SQL_MYSQL_PASSWORD || '321qwerty' }}
          OSH_TEXT2SQL_REDIS_HOST=${{ vars.OSH_TEXT2SQL_REDIS_HOST || '43.242.200.25' }}
          OSH_TEXT2SQL_REDIS_PORT=${{ vars.OSH_TEXT2SQL_REDIS_PORT || '56379' }}
          OSH_TEXT2SQL_REDIS_DATABASE=${{ vars.OSH_TEXT2SQL_REDIS_DATABASE || '0' }}
          OSH_TEXT2SQL_REDIS_PASSWORD=${{ secrets.OSH_TEXT2SQL_REDIS_PASSWORD || 'juegetech_88888888' }}
          OSH_TEXT2SQL_ES_BASE_URL=${{ vars.OSH_TEXT2SQL_ES_BASE_URL || 'http://43.242.200.25:59200' }}
          OSH_TEXT2SQL_ES_USERNAME=${{ secrets.OSH_TEXT2SQL_ES_USERNAME || 'elastic' }}
          OSH_TEXT2SQL_ES_PASSWORD=${{ secrets.OSH_TEXT2SQL_ES_PASSWORD || 'osh88888888' }}
          OSH_TEXT2SQL_KAFKA_BOOTSTRAP_SERVERS=${{ vars.OSH_TEXT2SQL_KAFKA_BOOTSTRAP_SERVERS || '43.242.200.25:59092' }}
          OSH_TEXT2SQL_KAFKA_SECURITY_PROTOCOL=${{ vars.OSH_TEXT2SQL_KAFKA_SECURITY_PROTOCOL || 'PLAINTEXT' }}
          OSH_TEXT2SQL_KAFKA_SASL_MECHANISM=${{ vars.OSH_TEXT2SQL_KAFKA_SASL_MECHANISM || '' }}
          OSH_TEXT2SQL_KAFKA_USERNAME=${{ secrets.OSH_TEXT2SQL_KAFKA_USERNAME }}
          OSH_TEXT2SQL_KAFKA_PASSWORD=${{ secrets.OSH_TEXT2SQL_KAFKA_PASSWORD }}
          OSH_TEXT2SQL_HBASE_ZOOKEEPER_QUORUM=${{ vars.OSH_TEXT2SQL_HBASE_ZOOKEEPER_QUORUM || '43.242.200.25' }}
          OSH_TEXT2SQL_HBASE_ZOOKEEPER_CLIENT_PORT=${{ vars.OSH_TEXT2SQL_HBASE_ZOOKEEPER_CLIENT_PORT || '52181' }}
          OSH_TEXT2SQL_HBASE_ZNODE_PARENT=${{ vars.OSH_TEXT2SQL_HBASE_ZNODE_PARENT || '/hbase-2514' }}
          OSH_TEXT2SQL_HBASE_NAMESPACE=${{ vars.OSH_TEXT2SQL_HBASE_NAMESPACE || 'default' }}
          OSH_TEXT2SQL_QA_BASE_URL=${{ vars.OSH_TEXT2SQL_QA_BASE_URL || 'http://43.242.200.67' }}
          OSH_TEXT2SQL_QA_USERNAME=${{ secrets.OSH_TEXT2SQL_QA_USERNAME || 'hope' }}
          OSH_TEXT2SQL_QA_PASSWORD=${{ secrets.OSH_TEXT2SQL_QA_PASSWORD || '123456' }}
          OSH_TEXT2SQL_QA_LIB_ID=${{ vars.OSH_TEXT2SQL_QA_LIB_ID || '2063135636288729089' }}
          OSH_TEXT2SQL_QA_MODULE=${{ vars.OSH_TEXT2SQL_QA_MODULE || 'es-schema' }}
          AI_ASSISTANT_REDIS_HOST=${{ vars.AI_ASSISTANT_REDIS_HOST || '43.242.200.67' }}
          AI_ASSISTANT_REDIS_PORT=${{ vars.AI_ASSISTANT_REDIS_PORT || '16379' }}
          AI_ASSISTANT_REDIS_PASSWORD=${{ secrets.AI_ASSISTANT_REDIS_PASSWORD || 'juegetech_88888888' }}
          AI_ASSISTANT_REDIS_DATABASE=${{ vars.AI_ASSISTANT_REDIS_DATABASE || '0' }}
          OSH_TEXT2SQL_MYSQL_TABLE_SELECTOR_MODE=${{ vars.OSH_TEXT2SQL_MYSQL_TABLE_SELECTOR_MODE || 'QA_ASSISTANT' }}
          OSH_TEXT2SQL_MYSQL_QA_SELECTOR_ENABLED=${{ vars.OSH_TEXT2SQL_MYSQL_QA_SELECTOR_ENABLED || 'true' }}
          OSH_TEXT2SQL_MYSQL_QA_SELECTOR_BASE_URL=${{ vars.OSH_TEXT2SQL_MYSQL_QA_SELECTOR_BASE_URL || 'http://43.242.200.67' }}
          OSH_TEXT2SQL_MYSQL_QA_SELECTOR_APP_ID=${{ vars.OSH_TEXT2SQL_MYSQL_QA_SELECTOR_APP_ID || '2063135247409639425' }}
          OSH_TEXT2SQL_MYSQL_QA_SELECTOR_APP_KEY=${{ secrets.OSH_TEXT2SQL_MYSQL_QA_SELECTOR_APP_KEY || 'fab3e3f2a1ae4a59a012c9b3de184c7f' }}
          OSH_TEXT2SQL_MYSQL_QA_SELECTOR_CHAT_ID=${{ vars.OSH_TEXT2SQL_MYSQL_QA_SELECTOR_CHAT_ID || 'mysql-table-selector' }}
          EOF
          chmod 600 '$BACKEND_ENV_FILE'"

      - name: Restart backend service
        run: |
          ssh -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "\
            cd '$DOCKER_COMPOSE_DIR' && \
            (docker compose --env-file '$DOCKER_STACK_ENV_FILE' -f '$DOCKER_COMPOSE_FILE' up -d '$BACKEND_SERVICE_NAME' || \
            docker-compose --env-file '$DOCKER_STACK_ENV_FILE' -f '$DOCKER_COMPOSE_FILE' up -d '$BACKEND_SERVICE_NAME') && \
            sleep 20 && \
            (docker compose --env-file '$DOCKER_STACK_ENV_FILE' -f '$DOCKER_COMPOSE_FILE' ps '$BACKEND_SERVICE_NAME' || \
            docker-compose --env-file '$DOCKER_STACK_ENV_FILE' -f '$DOCKER_COMPOSE_FILE' ps '$BACKEND_SERVICE_NAME')"

      - name: Verify remote health
        run: |
          ssh -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "\
            for i in \$(seq 1 60); do \
              if curl -fsS 'http://127.0.0.1:${APP_PORT}/api/health' >/dev/null; then \
                exit 0; \
              fi; \
              sleep 2; \
            done; \
            exit 1"
          curl -fsS "http://$DEPLOY_HOST:${APP_PORT}/api/health"

      - name: Dump remote diagnostics on failure
        if: failure()
        run: |
          ssh -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "\
            set -x; \
            cd '$DOCKER_COMPOSE_DIR' && \
            (docker compose --env-file '$DOCKER_STACK_ENV_FILE' -f '$DOCKER_COMPOSE_FILE' ps '$BACKEND_SERVICE_NAME' || \
            docker-compose --env-file '$DOCKER_STACK_ENV_FILE' -f '$DOCKER_COMPOSE_FILE' ps '$BACKEND_SERVICE_NAME' || true); \
            docker logs --tail 200 '$BACKEND_SERVICE_NAME' 2>&1 || true; \
            ss -lntp | egrep '${APP_PORT}|9100|16100|16120' || true"
