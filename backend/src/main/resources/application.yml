server:
  port: ${OSH_TEXT2SQL_SERVER_PORT:9100}

spring:
  application:
    name: osh-text2sql-backend
  redis:
    host: 43.242.200.25
    port: 56379
    database: 0
    password: ${secret.redis.password:juegetech_88888888}
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms

  # openai 配置
  openai:
    api-key: ${OSH_TEXT2SQL_OPENAI_API_KEY:}
    base-url: ${OSH_TEXT2SQL_OPENAI_BASE_URL:https://ai.yaoyanryan.dpdns.org}
    model: ${OSH_TEXT2SQL_OPENAI_MODEL:gpt-5.4}
    completions-path: ${OSH_TEXT2SQL_OPENAI_COMPLETIONS_PATH:/v1/chat/completions}
  ai:
    chat:
      client:
        enabled: ${OSH_TEXT2SQL_DASHSCOPE_ENABLED:false}
    dashscope:
      enabled: ${OSH_TEXT2SQL_DASHSCOPE_ENABLED:false}
      api-key: ${OSH_TEXT2SQL_DASHSCOPE_API_KEY:}
      chat:
        enabled: ${OSH_TEXT2SQL_DASHSCOPE_ENABLED:false}
        options:
          model: ${OSH_TEXT2SQL_DASHSCOPE_MODEL:qwen-plus}

management:
  endpoints:
    web:
      exposure:
        include: health,info

osh:
  text2sql:
    query-limit: 100
    default-timeout-seconds: 20
    ai:
      # openai|dashscope|aicodee
      provider: ${OSH_TEXT2SQL_AI_PROVIDER:aicodee}
      explain-result: false
      reasoning-effort: ${OSH_TEXT2SQL_AI_REASONING_EFFORT:medium}
      aicodee:
        api-key: ${OSH_TEXT2SQL_AICODEE_API_KEY:sk-d758a8ebc1aa79920b6a20d9fd14873a}
        base-url: ${OSH_TEXT2SQL_AICODEE_BASE_URL:https://v2.aicodee.com}
        model: ${OSH_TEXT2SQL_AICODEE_MODEL:MiniMax-M2.7-highspeed}
        completions-path: ${OSH_TEXT2SQL_AICODEE_COMPLETIONS_PATH:/v1/chat/completions}
    datasources:
      mysql:
        enabled: true
        host: ${OSH_TEXT2SQL_MYSQL_HOST:43.242.200.25}
        port: ${OSH_TEXT2SQL_MYSQL_PORT:53306}
        database: ${OSH_TEXT2SQL_MYSQL_DATABASE:backstage}
        username: ${OSH_TEXT2SQL_MYSQL_USERNAME:root}
        password: ${OSH_TEXT2SQL_MYSQL_PASSWORD:321qwerty}
      redis:
        enabled: true
        host: ${OSH_TEXT2SQL_REDIS_HOST:43.242.200.25}
        port: ${OSH_TEXT2SQL_REDIS_PORT:56379}
        password: ${OSH_TEXT2SQL_REDIS_PASSWORD:juegetech_88888888}
        database: ${OSH_TEXT2SQL_REDIS_DATABASE:0}
        list-cache:
          enabled: true
          ttl-minutes: 30
          key-prefix: osh:text2sql:redis:list
      elasticsearch:
        enabled: true
        base-url: ${OSH_TEXT2SQL_ES_BASE_URL:http://43.242.200.25:59200}
        username: ${OSH_TEXT2SQL_ES_USERNAME:elastic}
        password: ${OSH_TEXT2SQL_ES_PASSWORD:osh88888888}
        list-cache:
          enabled: true
          ttl-minutes: 30
          key-prefix: osh:text2sql:es:list
      kafka:
        enabled: true
        bootstrap-servers: ${OSH_TEXT2SQL_KAFKA_BOOTSTRAP_SERVERS:43.242.200.25:59092}
        security-protocol: ${OSH_TEXT2SQL_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        sasl-mechanism: ${OSH_TEXT2SQL_KAFKA_SASL_MECHANISM:}
        username: ${OSH_TEXT2SQL_KAFKA_USERNAME:}
        password: ${OSH_TEXT2SQL_KAFKA_PASSWORD:}
        list-cache:
          enabled: true
          ttl-minutes: 30
          key-prefix: osh:text2sql:kafka:list
      hbase:
        enabled: true
        zookeeper-quorum: ${OSH_TEXT2SQL_HBASE_ZOOKEEPER_QUORUM:43.242.200.25}
        zookeeper-client-port: ${OSH_TEXT2SQL_HBASE_ZOOKEEPER_CLIENT_PORT:52181}
        znode-parent: ${OSH_TEXT2SQL_HBASE_ZNODE_PARENT:/hbase-2514}
        namespace: ${OSH_TEXT2SQL_HBASE_NAMESPACE:default}
    qa-knowledge-import:
      enabled: true
      base-url: ${OSH_TEXT2SQL_QA_BASE_URL:http://43.242.200.67}
      username: ${OSH_TEXT2SQL_QA_USERNAME:hope}
      password: ${OSH_TEXT2SQL_QA_PASSWORD:123456}
      lib-id: ${OSH_TEXT2SQL_QA_LIB_ID:2063135636288729089}
      module: ${OSH_TEXT2SQL_QA_MODULE:es-schema}
      redis:
        host: ${AI_ASSISTANT_REDIS_HOST:43.242.200.67}
        port: ${AI_ASSISTANT_REDIS_PORT:16379}
        password: ${AI_ASSISTANT_REDIS_PASSWORD:juegetech_88888888}
        database: ${AI_ASSISTANT_REDIS_DATABASE:0}
    mysql-table-selector:
      # MySQL 自然语言选表模式：
      # LOCAL：走当前服务本地选表逻辑，根据问题和库表结构直接筛选候选表
      # QA_ASSISTANT：调用 QA assistant 对外 API 做选表，再将候选表交给 text2sql 继续生成 SQL
      mode: ${OSH_TEXT2SQL_MYSQL_TABLE_SELECTOR_MODE:QA_ASSISTANT}
      qa-assistant:
        enabled: ${OSH_TEXT2SQL_MYSQL_QA_SELECTOR_ENABLED:true}
        base-url: ${OSH_TEXT2SQL_MYSQL_QA_SELECTOR_BASE_URL:http://43.242.200.67}
        app-id: ${OSH_TEXT2SQL_MYSQL_QA_SELECTOR_APP_ID:2063135247409639425}
        app-key: ${OSH_TEXT2SQL_MYSQL_QA_SELECTOR_APP_KEY:fab3e3f2a1ae4a59a012c9b3de184c7f}
        chat-id: ${OSH_TEXT2SQL_MYSQL_QA_SELECTOR_CHAT_ID:mysql-table-selector}

logging:
  level:
    root: info
    org.springframework.ai: info
    com.osh.text2sql: info
